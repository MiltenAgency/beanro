<svg xmlns="http://www.w3.org/2000/svg" width="250" height="40" viewBox="0 0 250 40" fill="none">
  <!-- Inspired Japanese Tree Mark with Exactly 6 Leaves -->
  <g transform="translate(4, 2)" id="six-leaf-tree-mark">
    <!-- Rooted Trunk Base -->
    <path d="M 14 36 C 14 30 16 23 18 16 C 20 23 22 30 22 36 C 26 36 30 36 32 36 C 27 35 22 33 19 30 C 17 28 17 22 18 16 C 19 22 19 28 17 30 C 14 33 9 35 4 36 C 6 36 10 36 14 36 Z" fill="#1B382B"/>
    
    <!-- Central Trunk Stem -->
    <path d="M 16.5 18 C 16.5 12 19.5 12 19.5 18 C 19 24 17 24 16.5 18 Z" fill="#1B382B"/>

    <!-- Leaf 1: Lower Left -->
    <path d="M 16 26 C 9 26 3 29 2 34 C 8 33 14 30 16 26 Z" fill="#38A169"/>
    
    <!-- Leaf 2: Lower Right -->
    <path d="M 20 26 C 27 26 33 29 34 34 C 28 33 22 30 20 26 Z" fill="#38A169"/>
    
    <!-- Leaf 3: Middle Left -->
    <path d="M 16 18 C 7 17 3 21 2 25 C 4 19 10 15 16 17 Z" fill="#1B382B"/>
    
    <!-- Leaf 4: Middle Right -->
    <path d="M 20 18 C 29 17 33 21 34 25 C 32 19 26 15 20 17 Z" fill="#1B382B"/>
    
    <!-- Leaf 5: Top Left -->
    <path d="M 17 12 C 9 9 7 3 6 0 C 12 2 16 7 17 12 Z" fill="#38A169"/>
    
    <!-- Leaf 6: Top Right -->
    <path d="M 19 12 C 27 9 29 3 30 0 C 24 2 20 7 19 12 Z" fill="#38A169"/>
  </g>
  
  <!-- Brand Wordmark: KOMOREBI in Funky Bird -->
  <text x="48" y="26" font-family="'Funky Bird', 'Boldonse', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="0.05em" fill="#1B382B">KOMOREBI</text>
  
  <!-- Subtitle: TEAHOUSE & Japanese Kanji -->
  <text x="178" y="17" font-family="'Manrope', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.22em" fill="#38A169">TEAHOUSE</text>
  <text x="178" y="28" font-family="-apple-system, 'Noto Sans JP', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.18em" fill="#3E2A1E" opacity="0.85">木漏れ日</text>
</svg>